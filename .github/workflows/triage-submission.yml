name: triage server submission

# Submission issues may be created through the issue form, GitHub CLI, or API.
# Detect the form fields as well as the label so a missing template label cannot
# silently skip a valid submission. Reruns update one branch, PR, and status
# comment per issue. The hourly sweep reconciles any event lost to a transient
# Actions/API failure and resolves races between simultaneous submissions.
on:
  issues:
    types: [opened, edited, reopened, labeled]
  workflow_dispatch: {}
  schedule:
    - cron: "41 * * * *"

permissions:
  issues: write
  pull-requests: write
  contents: write

concurrency:
  group: triage-server-submission-${{ github.event.issue.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'issues' ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'server-submission') ||
      (github.event.action != 'labeled' &&
       (contains(github.event.issue.labels.*.name, 'server-submission') ||
        (startsWith(github.event.issue.title, '[Server]') &&
         contains(github.event.issue.body, '### GitHub repository URL'))))
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: parse, validate, and open or update PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { run } = require('./.github/scripts/triage-submission.js');
            if (context.eventName === 'issues') {
              await run({ github, context, core });
              return;
            }

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });
            const repository = await github.rest.repos.get(context.repo);
            const failures = [];
            for (const issue of issues.filter(item => !item.pull_request)) {
              const issueContext = {
                ...context,
                repo: context.repo,
                payload: { issue, repository: repository.data },
              };
              try {
                await run({ github, context: issueContext, core });
              } catch (error) {
                failures.push(`#${issue.number}: ${error.message}`);
                core.warning(`triage failed for #${issue.number}: ${error.message}`);
              }
            }
            if (failures.length) {
              core.setFailed(`triage sweep failures:\n${failures.join('\n')}`);
            }
